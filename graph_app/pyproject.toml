[project]
name = "agentecve-graph"
version = "0.1.0"
description = "Orquestração LangGraph do pipeline de 4 agentes (visualização no Studio)"
requires-python = ">=3.12"
dependencies = ["langgraph", "langgraph-cli", "google-genai", "pydantic"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["graph"]
